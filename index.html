<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>theCollective</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #EE7B1A;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-sizing: border-box;
    padding: 6vw;
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
    color: #24241f;
  }
  h1 {
    margin: 0 0 0.3em 0;
    font-weight: 800;
    font-size: clamp(2.4rem, 7vw, 5.5rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  p.sub {
    margin: 0 0 0.9em 0;
    font-weight: 600;
    font-size: clamp(1.1rem, 2.6vw, 1.8rem);
    line-height: 1.3;
    max-width: 40ch;
  }
  p.tagline {
    margin: 0.6em 0 0 0;
    font-weight: 800;
    font-style: italic;
    font-size: clamp(1.1rem, 2.8vw, 2rem);
  }
  p.contact {
    margin: 1.4em 0 0 0;
    font-weight: 600;
    font-size: clamp(0.9rem, 2vw, 1.3rem);
  }
  p.contact a {
    color: #24241f;
    text-decoration: none;
    border-bottom: 2px solid #24241f;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>theCollective</h1>
    <p class="sub">A group of growth experts ready to unlock your next EU market.</p>
    <p class="tagline">So... Go Big or Go Home...</p>
    <p class="contact">Contact: <a href="mailto:hi@thecollectivepl.com">hi@thecollectivepl.com</a></p>
  </div>
</body>
</html>
